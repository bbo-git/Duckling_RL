          frictionloss: 0.0045000000000000005
          viscous_damping: null
          delay_min_lag: 1
          delay_max_lag: 6
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 0.3
          damping: 0.003
          effort_limit: 0.0567
