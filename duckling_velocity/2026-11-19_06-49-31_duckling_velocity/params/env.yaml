          frictionloss: 0.009000000000000001
          viscous_damping: null
          delay_min_lag: 1
          delay_max_lag: 6
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 1.0
          damping: 0.01
          effort_limit: 0.1815
          out_joint: left_hip_pitch
          carrier_joint: left_hip_roll
          ratio: 1.5
          servo_speed: 9.0
        - target_names_expr: !!python/tuple
          - ^right_hip_pitch$
