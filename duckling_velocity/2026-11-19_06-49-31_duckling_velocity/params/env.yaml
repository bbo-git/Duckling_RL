          frictionloss: 0.003
          viscous_damping: null
          delay_min_lag: 1
          delay_max_lag: 6
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 2.0
          damping: 0.02
          effort_limit: 0.0605
          saturation_effort: 0.0605
          velocity_limit: 9.0
        - target_names_expr: !!python/tuple
          - ^head_pitch$
